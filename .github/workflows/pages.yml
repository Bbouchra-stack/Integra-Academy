name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Préparation de GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Envoi du site (HTML/CSS/JS statique, sans build)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publication
        id: deployment
        uses: actions/deploy-pages@v4
